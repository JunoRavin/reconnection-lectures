# Render the lecture book and deploy it to GitHub Pages on every push to main.
# The lectures are rendered from the committed .ipynb files (which already contain
# their outputs), so this build needs neither Gkeyll nor the simulation data.
name: Publish lectures

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install jupyter
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - run: quarto render
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
